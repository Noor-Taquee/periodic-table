version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: "increase"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:00"
      timezone: "Asia/Kolkata"
      groups:
        dev-dependencies:
          dependency-type: "development"
          update-types:
            - "minor"
            - "patch"
        prod-dependencies:
          dependency-type: "production"
          update-types:
            - "minor"
            - "patch"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:00"
      timezone: "Asia/Kolkata"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "build(actions)"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "dependencies"
